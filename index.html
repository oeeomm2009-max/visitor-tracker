<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ğ𝔥o̶ŚȚ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    color: #fff;
  }

  /* فيديو الخلفية */
  #bgVideo {
    position: fixed;
    top: 50%; left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    z-index: 0;
    object-fit: cover;
    filter: brightness(0.55) contrast(1.1);
  }

  /* طبقة تعتيم */
  .overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.85) 100%);
    z-index: 1;
  }

  /* شاشة الترحيب */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  #intro.hide {
    opacity: 0;
    transform: scale(1.05);
    pointer-events: none;
  }

  .enter-btn {
    background: #ffffff;
    color: #000000;
    border: none;
    padding: 22px 55px;
    font-size: 22px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    letter-spacing: 2px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow:
      0 0 30px rgba(255, 255, 255, 0.7),
      0 0 60px rgba(0, 255, 65, 0.5);
    animation: fadeIn 1.5s ease;
    max-width: 90vw;
    word-break: break-word;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .enter-btn:hover {
    transform: scale(1.06);
    box-shadow:
      0 0 45px rgba(255, 255, 255, 1),
      0 0 90px rgba(0, 255, 65, 0.8);
  }

  .enter-btn:active {
    transform: scale(0.97);
  }

  /* شاشة المعلومات */
  #site {
    position: fixed;
    inset: 0;
    z-index: 4;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }

  #site.show {
    display: flex;
  }

  .card {
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid #00ff41;
    border-radius: 8px;
    padding: 32px 26px;
    max-width: 540px;
    width: 100%;
    box-shadow:
      0 0 20px rgba(0, 255, 65, 0.4),
      0 0 60px rgba(0, 255, 65, 0.15),
      inset 0 0 30px rgba(0, 255, 65, 0.05);
    text-align: center;
    position: relative;
    animation: fade 0.8s ease;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card::before,
  .card::after {
    content: "";
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid #00ff41;
  }
  .card::before { top: -2px; right: -2px; border-left: none; border-bottom: none; }
  .card::after  { bottom: -2px; left: -2px; border-right: none; border-top: none; }

  .terminal-line {
    font-size: 12px;
    color: #00ff41;
    text-align: right;
    opacity: 0.7;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .icon {
    font-size: 50px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 12px #00ff41);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.85; }
  }

  h1.site-title {
    font-size: 22px;
    margin-bottom: 6px;
    color: #ffffff;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #00ff41, 0 0 20px rgba(0,255,65,0.5);
  }

  .subtitle {
    color: #00ff41;
    margin-bottom: 18px;
    font-size: 12px;
    letter-spacing: 1px;
  }

  .info-box {
    background: rgba(0, 0, 0, 0.6);
    border-radius: 6px;
    padding: 16px;
    margin-top: 16px;
    text-align: right;
    border: 1px solid rgba(0, 255, 65, 0.3);
    box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.05);
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 4px;
    border-bottom: 1px dashed rgba(0, 255, 65, 0.2);
    font-size: 13px;
    gap: 10px;
  }
  .info-row:last-child { border-bottom: none; }

  .label {
    color: #ffffff;
    opacity: 0.75;
    white-space: nowrap;
  }

  .value {
    color: #00ff41;
    font-weight: bold;
    word-break: break-all;
    text-align: left;
    max-width: 65%;
    text-shadow: 0 0 6px rgba(0, 255, 65, 0.6);
  }

  .status {
    margin-top: 18px;
    font-size: 12px;
    color: #00ff41;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 1px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ff41;
    box-shadow: 0 0 10px #00ff41;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }

  .loading { color: #ffcc00 !important; }
  .loading .dot { background: #ffcc00; box-shadow: 0 0 10px #ffcc00; }

  .error { color: #ff3b3b !important; }
  .error .dot { background: #ff3b3b; box-shadow: 0 0 10px #ff3b3b; }

  @media (max-width: 480px) {
    .enter-btn { padding: 16px 30px; font-size: 15px; letter-spacing: 1px; }
    .card { padding: 22px 16px; }
    h1.site-title { font-size: 18px; }
    .value, .label { font-size: 12px; }
  }
</style>
</head>
<body>

  <!-- فيديو الخلفية -->
  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="https://files.catbox.moe/dm0z8y.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <!-- شاشة الترحيب — زر واحد فقط -->
  <div id="intro">
    <button class="enter-btn" id="enterBtn">أهلاً بك في موقع Ğ𝔥o̶ŚȚ</button>
  </div>

  <!-- شاشة المعلومات -->
  <div id="site">
    <div class="card">
      <div class="terminal-line">Dev:Ğ𝔥o̶ŚȚ | TikTok:@0_m_z</div>
      <div class="icon">🖥️</div>
      <h1 class="site-title">Ğ𝔥o̶ŚȚ INFO</h1>
      <p class="subtitle">جارٍ تحليل بياناتك...</p>

      <div class="info-box">
        <div class="info-row">
          <span class="label">🌍 الدولة</span>
          <span class="value" id="country">...</span>
        </div>
        <div class="info-row">
          <span class="label">📍 المدينة</span>
          <span class="value" id="city">...</span>
        </div>
        <div class="info-row">
          <span class="label">📡 مزود الخدمة</span>
          <span class="value" id="isp">...</span>
        </div>
        <div class="info-row">
          <span class="label">🖥️ الجهاز</span>
          <span class="value" id="device">...</span>
        </div>
        <div class="info-row">
          <span class="label">🧭 المتصفح</span>
          <span class="value" id="browser">...</span>
        </div>
        <div class="info-row">
          <span class="label">🔢 عنوان IP</span>
          <span class="value" id="ip">...</span>
        </div>
      </div>

      <div class="status loading" id="status">
        <span class="dot"></span>
        <span id="statusText">جارٍ الاتصال بالسيرفر...</span>
      </div>
    </div>
  </div>

<script>
/* تشغيل الفيديو */
(function ensureVideoPlaying() {
  const video = document.getElementById("bgVideo");
  video.muted = true;
  video.play().catch(() => {
    const playOnce = () => {
      video.play().catch(() => {});
      document.removeEventListener("click", playOnce);
      document.removeEventListener("touchstart", playOnce);
    };
    document.addEventListener("click", playOnce);
    document.addEventListener("touchstart", playOnce);
  });
})();

/* معلومات الجهاز */
function getDeviceInfo() {
  const ua = navigator.userAgent;
  let os = "غير معروف";
  if (/Windows NT 10/.test(ua)) os = "Windows 10/11";
  else if (/Windows/.test(ua)) os = "Windows";
  else if (/Android/.test(ua)) os = "Android";
  else if (/iPhone|iPad|iPod/.test(ua)) os = "iOS";
  else if (/Mac OS X/.test(ua)) os = "macOS";
  else if (/Linux/.test(ua)) os = "Linux";

  let browser = "غير معروف";
  if (/Edg\//.test(ua)) browser = "Edge";
  else if (/OPR\//.test(ua)) browser = "Opera";
  else if (/Chrome\//.test(ua)) browser = "Chrome";
  else if (/Firefox\//.test(ua)) browser = "Firefox";
  else if (/Safari\//.test(ua)) browser = "Safari";

  const deviceType = /Mobile|Android|iPhone|iPad/.test(ua) ? "📱 موبايل" : "💻 كمبيوتر";
  return { os, browser, deviceType, ua };
}

/* جلب معلومات IP */
async function fetchIPInfo() {
  try {
    const res = await fetch("https://ipwho.is/");
    const data = await res.json();
    if (data && data.success) {
      return {
        ip: data.ip || "غير معروف",
        country: `${data.country || "?"} ${data.country_code ? "(" + data.country_code + ")" : ""}`,
        city: data.city || "غير معروف",
        isp: (data.connection && data.connection.isp) || (data.connection && data.connection.org) || "غير معروف"
      };
    }
  } catch (e) {
    console.warn("ipwho.is failed, trying fallback...", e);
  }

  try {
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();
    return {
      ip: data.ip || "غير معروف",
      country: `${data.country_name || "?"} (${data.country_code || "?"})`,
      city: data.city || "غير معروف",
      isp: data.org || "غير معروف"
    };
  } catch (e) {
    console.error("All IP APIs failed", e);
    return { ip: "غير معروف", country: "غير معروف", city: "غير معروف", isp: "غير معروف" };
  }
}

/* تحميل وعرض المعلومات */
async function loadInfo() {
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");

  statusEl.className = "status loading";
  statusText.textContent = "جارٍ الاتصال بالسيرفر...";

  try {
    const ipInfo = await fetchIPInfo();
    const dev = getDeviceInfo();

    document.getElementById("ip").textContent = ipInfo.ip;
    document.getElementById("country").textContent = ipInfo.country;
    document.getElementById("city").textContent = ipInfo.city;
    document.getElementById("isp").textContent = ipInfo.isp;
    document.getElementById("device").textContent = `${dev.deviceType} — ${dev.os}`;
    document.getElementById("browser").textContent = dev.browser;

    statusEl.className = "status";
    statusText.textContent = "تم جلب البيانات بنجاح ✓";
  } catch (e) {
    console.error(e);
    statusEl.className = "status error";
    statusText.textContent = "فشل تحميل البيانات";
  }
}

/* زر الدخول */
document.getElementById("enterBtn").addEventListener("click", () => {
  const intro = document.getElementById("intro");
  const site = document.getElementById("site");

  intro.classList.add("hide");

  setTimeout(() => {
    intro.style.display = "none";
    site.classList.add("show");

    const video = document.getElementById("bgVideo");
    if (video.paused) video.play().catch(() => {});

    loadInfo();
  }, 600);
});
</script>
</body>
</html>
